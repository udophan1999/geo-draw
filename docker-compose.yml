# MathMate anywhere with Docker, on a port (a test machine, or a server without Traefik).
#
#   cp .env.example .env              # fill in DEEPSEEK_API_KEY (DATABASE_URL optional)
#   docker compose up -d --build      # http://<machine>:8000
#
# On the shared VPS use docker-compose.prod.yml instead (Traefik, shared Postgres, no port):
# ./deploy.sh or the Jenkins pipeline.
#
# Accounts, conversations and daily usage go to PostgreSQL when DATABASE_URL is set, else to
# SQLite files in the volume; photos and drawings are always files in the volume.

services:
  app:
    build:
      context: .
      target: runtime
    image: mathmate:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GEO_DRAW_DATA_DIR: /data
    volumes:
      - mathmate-data:/data
    extra_hosts:
      # Lets DATABASE_URL reach a PostgreSQL running on the server itself (not in Docker).
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-8000}:8000"

volumes:
  mathmate-data:
