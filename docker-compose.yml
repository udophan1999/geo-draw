# MathMate in production.
#
#   cp .env.example .env              # fill in DEEPSEEK_API_KEY
#   docker compose up -d --build      # http://<server>:8000
#
# Behind the Traefik already running on the server (HTTPS on your domain, no open port):
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#
# Accounts, conversations and daily usage go to PostgreSQL (DATABASE_URL in .env); photos and
# drawings are files in the "mathmate-data" volume. Without DATABASE_URL, SQLite files in the
# volume are used instead.

services:
  app:
    build: .
    image: mathmate:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GEO_DRAW_DATA_DIR: /data
    volumes:
      - mathmate-data:/data
    extra_hosts:
      # Lets DATABASE_URL reach a PostgreSQL running on the server itself (not in Docker).
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-8000}:8000"

volumes:
  mathmate-data:
