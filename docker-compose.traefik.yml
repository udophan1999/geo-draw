# Serve MathMate through an existing Traefik (Docker provider), over HTTPS on $DOMAIN.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#
# Set in .env: DOMAIN, and GEO_DRAW_COOKIE_SECURE=1. When your Traefik uses other names than
# the defaults below, also set TRAEFIK_NETWORK, TRAEFIK_ENTRYPOINT, TRAEFIK_CERTRESOLVER.
# Traefik passes the SSE job streams through as they are written. Do not add a `buffering`
# middleware to this router: it would hold the stream back until the job ends.

services:
  app:
    ports: !reset []  # reachable only through Traefik
    environment:
      # Believe X-Forwarded-For only from Traefik (private Docker addresses), so the per-IP
      # limits see the real client: uvicorn then reads the header from the right and stops
      # at the first address that is not a trusted proxy.
      FORWARDED_ALLOW_IPS: ${TRAEFIK_PROXY_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.mathmate.rule: Host(`${DOMAIN:?Đặt DOMAIN trong .env}`)
      traefik.http.routers.mathmate.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.mathmate.tls: "true"
      traefik.http.routers.mathmate.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.mathmate.loadbalancer.server.port: "8000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
